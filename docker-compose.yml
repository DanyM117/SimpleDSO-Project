version: "3.8"

services:
  agent-db:
    image: postgres:16-alpine
    container_name: simpledso-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_core}
      POSTGRES_USER: ${POSTGRES_USER:-agent_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AgentPostgresSecure2026!}
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_admin} -d ${POSTGRES_DB:-agent_core}"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-core:
    image: ${ECR_REGISTRY:-simpledso-agent}:${IMAGE_TAG:-latest}
    # Quitamos el container_name explícito para evitar conflictos de DNS interno con Nginx
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - PORT=5000
      - AWS_REGION=us-east-1
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-us.anthropic.claude-3-5-sonnet-20241022-v2:0}
      - DB_HOST=agent-db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-agent_core}
      - DB_USER=${POSTGRES_USER:-agent_admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-AgentPostgresSecure2026!}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-agent_admin}:${POSTGRES_PASSWORD:-AgentPostgresSecure2026!}@agent-db:5432/${POSTGRES_DB:-agent_core}
      - ERP_HOST=${ERP_HOST:-host.docker.internal:8080}
    depends_on:
      agent-db:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    container_name: simpledso-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - agent-core

volumes:
  agent_pgdata: