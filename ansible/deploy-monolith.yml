---
- name: Desplegar Stack Monolitico SimpleDSO
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Instalar dependencias base en Amazon Linux 2023
      ansible.builtin.dnf:
        name:
          - git
          - docker
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Iniciar y habilitar servicio Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Autenticar Docker contra AWS ECR usando el Instance Profile
      ansible.builtin.shell: |
        aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_registry }}
      changed_when: false

    - name: Crear directorio de la aplicacion
      ansible.builtin.file:
        path: /opt/simpledso
        state: directory
        mode: '0755'

    - name: Copiar definicion de Docker Compose
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: /opt/simpledso/docker-compose.yml
        mode: '0644'

    - name: Desplegar contenedores con Docker Compose
      ansible.builtin.command:
        cmd: docker compose pull && docker compose up -d --remove-orphans
        chdir: /opt/simpledso
      environment:
        ECR_REGISTRY: "{{ ecr_registry }}"
        IMAGE_TAG: "{{ image_tag }}"
        ERP_HOST: "{{ 'host.docker.internal:8080' if erp_target == 'cloud' else onprem_ip }}"
      changed_when: true

    - name: Desplegar frappe_docker (ERP Cloud)
      when: erp_target == 'cloud'
      block:
        - name: Clonar repositorio frappe_docker
          ansible.builtin.git:
            repo: https://github.com/frappe/frappe_docker.git
            dest: /opt/frappe_docker
            version: main

        - name: Configurar .env de ERPNext
          ansible.builtin.copy:
            dest: /opt/frappe_docker/.env
            content: |
              ERPNEXT_VERSION=v15.0.0
              FRAPPE_VERSION=v15.0.0
              MARIADB_ROOT_PASSWORD=AdminStrongRootPassword2026!
              ADMIN_PASSWORD=AdminStrongErpPassword2026!
              SITES=api.erp.internal
            mode: '0600'

        - name: Levantar contenedores de ERPNext
          ansible.builtin.command:
            cmd: docker compose --project-name erpnext -f compose.yaml -f overrides/compose.noproxy.yaml up -d
            chdir: /opt/frappe_docker
          changed_when: false