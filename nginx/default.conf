# Enrutamiento para el Agente IA (Default para peticiones directas por IP)
server {
    listen 80 default_server;
    server_name _;

    location / {
        # Usar resolución DNS interna de Docker
        proxy_pass http://agent-core:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Enrutamiento Multi-Tenant Catch-All para ERPNext
server {
    listen 80;
    server_name ~^(?<tenant>.+)\.tudominio\.com$; 

    location / {
        # Frappe expone el puerto al host a través del compose.noproxy.yaml
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}