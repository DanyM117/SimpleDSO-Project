# Enrutamiento para el Agente IA (ej. endpoint API o subdominio específico)
server {
    listen 80;
    server_name ia.tudominio.com; # Cambiar por tu dominio real o usar un location /api/

    location / {
        proxy_pass http://host.docker.internal:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Enrutamiento Multi-Tenant Catch-All para ERPNext
server {
    listen 80;
    # Captura cualquier subdominio que no sea el agente (ej. clinica1.tudominio.com, barberia.tudominio.com)
    server_name ~^(?<tenant>.+)\.tudominio\.com$; 

    location / {
        # Redirige al contenedor 'frontend' de frappe_docker que expone el puerto 8080
        proxy_pass http://host.docker.internal:8080;
        
        # CRÍTICO: Frappe lee esto para saber a qué base de datos conectar
        proxy_set_header Host $host; 
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Soporte para WebSockets de Frappe
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}