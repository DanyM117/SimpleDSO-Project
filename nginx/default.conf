upstream agent_backend {
    server agent-core:5000;
}

upstream erp_backend {
    server host.docker.internal:8080;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # 1. Tráfico del Agente IA (Inferencia y Health Checks)
    location ~ ^/(api/|healthz|ready) {
        proxy_pass http://agent_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 2. Panel Web de ERPNext (Raíz)
    location / {
        proxy_pass http://erp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Requerido para SocketIO / Desk en tiempo real
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}