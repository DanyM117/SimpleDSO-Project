mkdir -p nginx
cat << 'EOF' > nginx/default.conf
upstream agent_backend {
    server agent-core:5000;
}

upstream erp_backend {
    server host.docker.internal:8080;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # 1. Rutas públicas del Agente IA (Inferencia y Health Checks)
    location ~ ^/(api/|healthz|ready) {
        proxy_pass http://agent_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 2. Panel Web de ERPNext
    location / {
        # Si deseas restringir la administración a tu IP pública, descomenta:
        # allow <TU_IP_PUBLICA>/32;
        # deny all;

        proxy_pass http://erp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Handshake WebSocket requerido por Frappe/SocketIO
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
EOF