name: Destroy Dev Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destruction:
        description: 'Escribe "DESTROY" para confirmar la eliminación total de Dev (Core + Addons)'
        required: true
        type: string

concurrency:
  group: deploy-infra-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy-infra:
    name: "Destroy Full Dev Stack"
    runs-on: ubuntu-latest
    environment: dev
    
    # Válvula de seguridad contra ejecuciones accidentales
    if: github.event.inputs.confirm_destruction == 'DESTROY'

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'simpledso-infra-tfstate-104091534720' }}
      DYNAMODB_TABLE: ${{ vars.DYNAMODB_TABLE || 'SimpleDSo-infra-tfstate-lock' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Configure Kubeconfig Context
        run: |
          echo "[*] Obteniendo contexto del clúster EKS..."
          aws eks update-kubeconfig \
            --name simpledso-eks-cluster \
            --region ${{ env.AWS_REGION }} || true

      - name: 1. Delete K8s Workloads & Secrets
        run: |
          echo "[*] Purgando workload de Kubernetes..."
          kubectl delete -k k8s/apps/agent-core/ --ignore-not-found --timeout=60s || true
          kubectl delete -f k8s/base/external-secrets/ --ignore-not-found --timeout=60s || true
          kubectl delete secret agent-postgres-secret -n default --ignore-not-found || true

      - name: 2. Destroy ERP Cloud (Liberar ENI en VPC)
        working-directory: envs/dev/erp
        run: |
          if [ -f "main.tf" ]; then
            echo "[*] Destruyendo instancia EC2 y DNS de ERP..."
            terraform init \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="dynamodb_table=${DYNAMODB_TABLE}" \
              -backend-config="region=${AWS_REGION}"
            terraform destroy -auto-approve -var-file="terraform.tfvars" -var="state_bucket_name=${TF_STATE_BUCKET}" || true
          fi

      - name: 3. Destroy Kubernetes Addons (Tailscale & ESO)
        working-directory: envs/dev/addons
        run: |
          echo "[*] Destruyendo releases de Helm de Addons..."
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${DYNAMODB_TABLE}" \
            -backend-config="region=${AWS_REGION}"
          terraform destroy -auto-approve -var-file="terraform.tfvars" || true

      - name: 4. Destroy Core Infrastructure (EKS, RDS, VPC)
        working-directory: envs/dev
        run: |
          echo "[*] Destruyendo infraestructura base..."
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${DYNAMODB_TABLE}" \
            -backend-config="region=${AWS_REGION}"
          terraform destroy -auto-approve -var-file="terraform.tfvars"