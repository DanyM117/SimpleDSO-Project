name: "DevSecOps - Deploy Monolith Stack (EC2 Only)"

on:
  push:
    branches:
      - feature/monolithic-ec2
  workflow_dispatch:
    inputs:
      erp_target:
        description: 'Estrategia ERPNext (cloud / onpremise)'
        required: true
        default: 'cloud'
        type: choice
        options:
          - cloud
          - onpremise
      onprem_ip:
        description: 'IP privada/Tailscale si erp_target == onpremise'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  TF_STATE_BUCKET: "simpledso-infra-tfstate-104091534720"
  DYNAMODB_TABLE: "SimpleDSo-infra-tfstate-lock"
  ECR_REPOSITORY: "simpledso-agent"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  static-analysis:
    name: "SAST & SCA Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff bandit pip-audit
      - run: ruff check .
      - run: bandit -r app.py -ll
      - run: pip-audit -r requirements.txt

  provision-infra:
    name: "Terraform Apply (VPC & EC2)"
    needs: [static-analysis]
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: envs/dev-ec2
    outputs:
      instance_id: ${{ steps.tf_outputs.outputs.instance_id }}
      public_ip: ${{ steps.tf_outputs.outputs.public_ip }}
      ecr_registry: ${{ steps.tf_outputs.outputs.ecr_registry }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init & Apply
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/ec2-monolith/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.DYNAMODB_TABLE }}" \
            -backend-config="encrypt=true"
          terraform apply -auto-approve \
            -var="erp_target=${{ github.event.inputs.erp_target || 'cloud' }}"

      - name: Export Outputs
        id: tf_outputs
        run: |
          echo "instance_id=$(terraform output -raw instance_id)" >> $GITHUB_OUTPUT
          echo "public_ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT
          echo "ecr_registry=$(terraform output -raw ecr_repository_url | cut -d/ -f1)" >> $GITHUB_OUTPUT

  build-and-push-ecr:
    name: "Build ARM64 & Push to ECR"
    needs: [provision-infra]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

  ansible-deploy:
    name: "Deploy Containers via AWS SSM"
    needs: [provision-infra, build-and-push-ecr]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Esperar a que la instancia registre en SSM
        run: |
          INSTANCE_ID="${{ needs.provision-infra.outputs.instance_id }}"
          echo "[*] Verificando SSM Agent en $INSTANCE_ID..."
          STATUS="None"
          for i in {1..36}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "None")
            if [ "$STATUS" = "Online" ]; then
              echo "[OK] Instancia conectada y en línea."
              break
            fi
            sleep 5
          done
          [ "$STATUS" = "Online" ] || exit 1

      - name: Ejecutar Despliegue en EC2 via SSM Send-Command
        run: |
          INSTANCE_ID="${{ needs.provision-infra.outputs.instance_id }}"
          ECR_REG="${{ needs.provision-infra.outputs.ecr_registry }}"
          IMAGE_TAG="${{ env.IMAGE_TAG }}"
          ERP_TARGET="${{ github.event.inputs.erp_target || 'cloud' }}"

          # Lógica para inyectar la IP correcta según el Target
          if [ "$ERP_TARGET" = "onpremise" ]; then
            ERP_HOST="${{ github.event.inputs.onprem_ip }}:80"
          else
            ERP_HOST="host.docker.internal:8080"
          fi
          
          COMPOSE_B64=$(base64 -w 0 docker-compose.yml)
          NGINX_CONF_B64=$(base64 -w 0 nginx/default.conf)

          cat << 'EOF' > deploy_remote.sh
          #!/usr/bin/env bash
          set -euo pipefail

          echo "[0/4] Configurando 4GB de memoria Swap para evitar bloqueos (OOM)..."
          if [ ! -f /swapfile ]; then
            fallocate -l 4G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
          fi

          echo "[1/4] Instalando dependencias base..."
          dnf install -y docker git
          systemctl enable --now docker

          echo "[2/4] Instalando Docker Compose de forma segura..."
          # 1. Limpiar cualquier binario corrupto o página HTML descargada previamente
          rm -f /usr/local/lib/docker/cli-plugins/docker-compose
          rm -f /usr/libexec/docker/cli-plugins/docker-compose
          
          mkdir -p /usr/local/lib/docker/cli-plugins
          mkdir -p /usr/libexec/docker/cli-plugins
          
          # 2. Forzar descarga de una versión estable con flag -f para abortar si hay error HTTP
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-linux-x86_64" -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          
          # 3. Crear enlaces simbólicos en las rutas nativas de Amazon Linux 2023
          ln -sf /usr/local/lib/docker/cli-plugins/docker-compose /usr/libexec/docker/cli-plugins/docker-compose
          ln -sf /usr/local/lib/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose

          if [ "__ERP_TARGET__" = "cloud" ]; then
            echo "[3/4] Desplegando Stack de ERPNext (Producción Multi-tenant)..."
            if [ ! -d "/opt/frappe_docker" ]; then
              git clone https://github.com/frappe/frappe_docker.git /opt/frappe_docker
            fi
            cd /opt/frappe_docker
            
            # CORRECCIÓN: Unificamos DB_PASSWORD al root real esperado
            echo "ERPNEXT_VERSION=v15.0.0" > .env
            echo "FRAPPE_VERSION=v15.0.0" >> .env
            echo "DB_PASSWORD=AdminStrongRootPassword2026!" >> .env 
            echo "ADMIN_PASSWORD=AdminStrongErpPassword2026!" >> .env
            echo "SITES=api.erp.internal" >> .env

            export COMPOSE_FILES="-f compose.yaml -f overrides/compose.noproxy.yaml -f overrides/compose.mariadb.yaml -f overrides/compose.redis.yaml"

            docker compose --project-name erpnext $COMPOSE_FILES pull
            docker compose --project-name erpnext $COMPOSE_FILES up -d

            echo "[*] Esperando disponibilidad de MariaDB..."
            DB_READY=0
            for i in {1..40}; do
              if docker compose --project-name erpnext exec -T db mariadb -u root -p'AdminStrongRootPassword2026!' -e "SELECT 1;" >/dev/null 2>&1; then
                DB_READY=1
                echo "[OK] MariaDB está en línea y aceptando conexiones."
                break
              fi
              echo "Esperando a la base de datos... ($i/40)"
              sleep 5
            done
            
            if [ "$DB_READY" -eq 0 ]; then
              echo "[ERROR] El contenedor de MariaDB no inició o rechazó la conexión. Abortando."
              docker compose --project-name erpnext logs db
              exit 1
            fi
            
            docker compose --project-name erpnext exec -T backend bench config dns_multitenant on
            
            if ! docker compose --project-name erpnext exec -T backend ls sites/api.erp.internal > /dev/null 2>&1; then
              echo "[*] Creando esquema para api.erp.internal (tomará entre 10 y 20 minutos)..."
              docker compose --project-name erpnext exec -T backend bench new-site api.erp.internal \
                --mariadb-root-password AdminStrongRootPassword2026! \
                --admin-password AdminStrongErpPassword2026! \
                --db-host db \
                --install-app erpnext \
                --set-default
            else
              echo "[*] El tenant api.erp.internal ya existe en el volumen. Omitiendo aprovisionamiento."
            fi
          fi

          echo "[4/4] Desplegando Nginx Proxy y Agente IA..."
          aws ecr get-login-password --region __AWS_REGION__ | docker login --username AWS --password-stdin __ECR_REG__
          mkdir -p /opt/simpledso/nginx
          echo '__COMPOSE_B64__' | base64 -d > /opt/simpledso/docker-compose.yml
          echo '__NGINX_CONF_B64__' | base64 -d > /opt/simpledso/nginx/default.conf

          cd /opt/simpledso
          export ECR_REGISTRY="__ECR_REG__/simpledso-agent"
          export IMAGE_TAG="__IMAGE_TAG__"
          export ERP_HOST="__ERP_HOST__"
          docker compose pull agent-core
          docker compose up -d --remove-orphans
          EOF

          sed -i "s|__AWS_REGION__|${{ env.AWS_REGION }}|g" deploy_remote.sh
          sed -i "s|__ECR_REG__|${ECR_REG}|g" deploy_remote.sh
          sed -i "s|__IMAGE_TAG__|${IMAGE_TAG}|g" deploy_remote.sh
          sed -i "s|__ERP_HOST__|${ERP_HOST}|g" deploy_remote.sh
          sed -i "s|__ERP_TARGET__|${ERP_TARGET}|g" deploy_remote.sh
          sed -i "s|__COMPOSE_B64__|${COMPOSE_B64}|g" deploy_remote.sh
          sed -i "s|__NGINX_CONF_B64__|${NGINX_CONF_B64}|g" deploy_remote.sh

          SCRIPT_B64=$(base64 -w 0 deploy_remote.sh)

          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 1800 \
            --parameters commands="[\"echo '$SCRIPT_B64' | base64 -d | bash\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "[*] Monitoreando Command ID: $COMMAND_ID vía polling..."
          STATUS="InProgress"
          ELAPSED=0
          while [[ "$STATUS" == "InProgress" || "$STATUS" == "Pending" ]]; do
            sleep 10
            ELAPSED=$((ELAPSED + 10))
            STATUS=$(aws ssm get-command-invocation \
              --region ${{ env.AWS_REGION }} \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "InProgress")
            echo "[-] Estado: $STATUS (${ELAPSED}s / 1800s)..."
            [ $ELAPSED -ge 1800 ] && break
          done

          aws ssm get-command-invocation \
            --region ${{ env.AWS_REGION }} \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Salida:StandardOutputContent, Error:StandardErrorContent}' \
            --output text || true

          [ "$STATUS" = "Success" ] || exit 1
      - name: Smoke Tests en Vivo (Puerto 80 Unificado)
        run: |
          PUBLIC_IP="${{ needs.provision-infra.outputs.public_ip }}"
          
          echo "[*] Test 1: Validando Healthcheck del Agente IA (GET /ready)..."
          curl --fail --retry 10 --retry-delay 5 "http://${PUBLIC_IP}/ready"

          echo "[*] Test 2: Validando ERPNext UI simulando subdominio Tenant (GET /)..."
          # Inyectamos el header Host para que Nginx lo envíe a Frappe/ERPNext
          curl --fail --retry 10 --retry-delay 5 -H "Host: api.erp.internal" "http://${PUBLIC_IP}/" >/dev/null

          echo "[*] Test 3: Validando Inferencia Claude en Bedrock (POST /api/v1/chat)..."
          curl --fail -X POST "http://${PUBLIC_IP}/api/v1/chat" \
            -H "Content-Type: application/json" \
            -d '{"session_id": "smoke-test-nginx", "message": "Hola"}'