name: "DevSecOps Pipeline - Phase 3 Application Delivery"

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'k8s/apps/**'
      - 'envs/dev/erp/**'
      - '.github/workflows/deploy-phase3.yml'
  workflow_dispatch:
    inputs:
      erp_target:
        description: 'Estrategia ERPNext (cloud / onpremise / none)'
        required: true
        default: 'cloud'
        type: choice
        options:
          - cloud
          - onpremise
          - none

concurrency:
  group: deploy-phase3-app
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'simpledso-infra-tfstate-104091534720' }}
  DYNAMODB_TABLE: ${{ vars.DYNAMODB_TABLE || 'SimpleDSo-infra-tfstate-lock' }}
  ECR_REPOSITORY: "simpledso-agent"
  IMAGE_TAG: ${{ github.sha }}
  ERP_TARGET: ${{ github.event.inputs.erp_target || 'cloud' }}

jobs:
  static-analysis:
    name: "SAST & SCA Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Analysis Tools
        run: pip install ruff bandit pip-audit
      - name: Linting (Ruff)
        run: ruff check .
      - name: SAST Code Analysis (Bandit)
        run: bandit -r app.py -ll
      - name: SCA Dependency Audit (pip-audit)
        run: pip-audit -r requirements.txt

  build-and-scan:
    name: "Build ARM64 & Trivy Scan"
    needs: [static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ARM64 Local Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
      - name: Run Aqua Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

  ecr-push:
    name: "ECR Push via OIDC"
    needs: [build-and-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push Multi-Platform Image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  # Aprovisionamiento condicional de la EC2 en Fase 3
  deploy-erp-cloud:
    name: "Deploy ERP Cloud (EC2 & DNS)"
    if: github.event.inputs.erp_target == 'cloud' || (github.event_name == 'push' && env.ERP_TARGET == 'cloud')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev/erp
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: Initialize Backend
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/erp/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.DYNAMODB_TABLE }}" \
            -backend-config="encrypt=true"
      - name: Apply ERP EC2 & Route53 Record
        env:
          TF_VAR_key_pair_name: ${{ secrets.EC2_KEY_PAIR_NAME }}
        run: |
          terraform apply -auto-approve \
            -var-file="terraform.tfvars" \
            -var="state_bucket_name=${{ env.TF_STATE_BUCKET }}" \
            -var="key_pair_name=${TF_VAR_key_pair_name}"

  k8s-deploy:
    name: "Deploy to EKS Cluster"
    needs: [ecr-push, deploy-erp-cloud]
    # Se ejecuta si ecr-push tuvo éxito y deploy-erp-cloud tuvo éxito o fue omitido (none/onpremise)
    if: |
      always() &&
      needs.ecr-push.result == 'success' &&
      (needs.deploy-erp-cloud.result == 'success' || needs.deploy-erp-cloud.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Generate Kubeconfig Context
        run: |
          aws eks update-kubeconfig --name simpledso-eks-cluster --region ${{ env.AWS_REGION }}

      - name: Deploy Workload via Kustomize
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          cd k8s/apps/agent-core
          kustomize edit set image 104091534720.dkr.ecr.us-east-1.amazonaws.com/simpledso-agent:latest=${REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          kubectl apply -k .

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/agent-core -n default --timeout=180s

      - name: Smoke Tests (Database & DNS)
        run: |
          echo "[*] Verificando logs del pod..."
          kubectl logs -n default deployment/agent-core --tail=30
          echo "[*] Validando persistencia (/ready)..."
          kubectl exec -n default deployment/agent-core -- wget -qO- http://127.0.0.1:5000/ready
          echo "[*] Validando resolución DNS híbrida hacia ERP (/api/v1/erp/ping)..."
          kubectl exec -n default deployment/agent-core -- wget -qO- http://127.0.0.1:5000/api/v1/erp/ping