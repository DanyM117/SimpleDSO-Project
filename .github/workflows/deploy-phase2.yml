name: "DevSecOps Pipeline - Phase 2 Infrastructure & Addons"

on:
  workflow_dispatch:
    inputs:
      erp_target:
        description: 'Estrategia de persistencia ERPNext (cloud / onpremise / none)'
        required: true
        default: 'cloud'
        type: choice
        options:
          - cloud
          - onpremise
          - none
      onprem_ip:
        description: 'IP interna/Tailscale del servidor on-premise (si erp_target == onpremise)'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'simpledso-infra-tfstate-104091534720' }}
  DYNAMODB_TABLE: ${{ vars.DYNAMODB_TABLE || 'SimpleDSo-infra-tfstate-lock' }}
  ERP_TARGET: ${{ github.event.inputs.erp_target || 'cloud' }}
  ONPREM_IP: ${{ github.event.inputs.onprem_ip || '' }}
  TF_ROLE: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  # =========================================================================
  # 1. EVALUACIÓN ESTÁTICA Y ESCANEO SHIFT-LEFT
  # =========================================================================
  security-and-lint:
    name: "SAST & IaC Security Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r app.py -ll

      - name: Run Aqua Trivy (IaC Misconfigurations)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          trivyignores: 'envs/dev/.trivyignore'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # =========================================================================
  # 2. PROVISIÓN DE INFRAESTRUCTURA BASE (CORE)
  # =========================================================================
  deploy-core:
    name: "Terraform Apply (Core Infrastructure)"
    needs: [security-and-lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    outputs:
      eks_cluster_name: ${{ steps.tf_outputs.outputs.eks_cluster_name }}
      agent_db_secret_arn: ${{ steps.tf_outputs.outputs.agent_db_secret_arn }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Initialize Backend
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/core/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.DYNAMODB_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Validate Syntax & Configuration
        run: terraform validate

      - name: Apply Core Infrastructure
        env:
          TF_VAR_key_pair_name: ${{ secrets.EC2_KEY_PAIR_NAME }}
          TF_VAR_erp_target: ${{ env.ERP_TARGET }}
          TF_VAR_onprem_erp_ip: ${{ env.ONPREM_IP }}
          TF_VAR_admin_principal_arn: ${{ secrets.LOCAL_ADMIN_IAM_ARN }}
        run: |
          terraform apply -auto-approve \
            -var-file="terraform.tfvars" \
            -var="key_pair_name=${TF_VAR_key_pair_name}" \
            -var="erp_target=${TF_VAR_erp_target}" \
            -var="onprem_erp_ip=${TF_VAR_onprem_erp_ip}" \
            -var="admin_principal_arn=${TF_VAR_admin_principal_arn}"

      - name: Export Critical Outputs
        id: tf_outputs
        run: |
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "agent_db_secret_arn=$(terraform output -raw agent_db_secret_arn)" >> $GITHUB_OUTPUT

  # =========================================================================
  # 3. SINCRONIZACIÓN DE SECRETOS OAUTH EN AWS SECRETS MANAGER
  # =========================================================================
  sync-tailscale-secrets:
    name: "Sync Tailscale OAuth Credentials"
    needs: [deploy-core]
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inject OAuth Credentials to AWS Secrets Manager
        run: |
          SECRET_NAME="dev/tailscale/oauth"
          SECRET_PAYLOAD="{\"client_id\":\"${{ secrets.TS_CLIENT_ID }}\",\"client_secret\":\"${{ secrets.TS_CLIENT_SECRET }}\"}"

          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" >/dev/null 2>&1; then
            echo "[*] Actualizando credenciales en secreto existente: $SECRET_NAME"
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_NAME" \
              --secret-string "$SECRET_PAYLOAD"
          else
            echo "[*] Registrando nuevo secreto en Secrets Manager: $SECRET_NAME"
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "Credenciales OAuth de Tailscale Operator administradas via GitHub Actions" \
              --secret-string "$SECRET_PAYLOAD"
          fi

  # =========================================================================
  # 4. INSTALACIÓN DE COMPLEMENTOS HELM (ADDONS)
  # =========================================================================
  deploy-addons:
    name: "Terraform Apply (Kubernetes Addons)"
    needs: [sync-tailscale-secrets]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev/addons
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Initialize Backend
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/addons/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.DYNAMODB_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Validate Addons Configuration
        run: terraform validate

      - name: Apply Helm Releases (Tailscale & ESO)
        run: |
          terraform apply -auto-approve \
            -var-file="terraform.tfvars" \
            -var="state_bucket_name=${{ env.TF_STATE_BUCKET }}"

  # =========================================================================
  # 5. RECONCILIACIÓN DE MANIFIESTOS Y PRUEBAS OPERATIVAS (SMOKE TESTS)
  # =========================================================================
  k8s-reconciliation:
    name: "Kubernetes Smoke Tests & Secrets Sync"
    needs: [deploy-core, deploy-addons]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Generate Kubeconfig Context
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.deploy-core.outputs.eks_cluster_name }} \
            --region ${{ env.AWS_REGION }}

      - name: Verify Rollout Status of Controllers
        run: |
          echo "[*] Esperando a que External Secrets Operator este listo..."
          kubectl rollout status deployment/external-secrets -n external-secrets --timeout=180s

          echo "[*] Esperando a que Tailscale Operator este listo..."
          if ! kubectl rollout status deployment/operator -n tailscale --timeout=90s; then
            echo "::warning::Tailscale Operator no logro estabilizarse a tiempo. Revisa logs y credenciales OAuth."
            kubectl logs -n tailscale deployment/operator --tail=30 || true
          fi
        

      - name: Deploy ClusterSecretStore & ExternalSecret
        env:
          RDS_SECRET_ARN: ${{ needs.deploy-core.outputs.agent_db_secret_arn }}
        run: |
          # 1. Aplicar Store generico (hereda identidad Pod Identity)
          kubectl apply -f k8s/base/external-secrets/cluster-secret-store.yaml

          # 2. Inyectar dinamicamente el ARN real de RDS en el manifiesto ExternalSecret
          sed -i "s|key: simpledso-dev-agent-db-xxxx|key: ${RDS_SECRET_ARN}|g" \
            k8s/base/external-secrets/agent-db-external-secret.yaml

          kubectl apply -f k8s/base/external-secrets/agent-db-external-secret.yaml

      - name: Validate K8s Secret Materialization
        run: |
          echo "[*] Validando reconciliacion del ExternalSecret contra AWS Secrets Manager..."
          STATUS="False"
          for i in {1..30}; do
            STATUS=$(kubectl get externalsecret agent-db-credentials -n default -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "False")
            if [ "$STATUS" == "True" ]; then
              echo "[OK] ExternalSecret reconciliado exitosamente."
              break
            fi
            echo "Reconciliando secreto... intento $i/30"
            sleep 5
          done

          if [ "$STATUS" != "True" ]; then
            echo "[X] Error critico: El ExternalSecret no alcanzo estado Ready."
            kubectl describe externalsecret agent-db-credentials -n default
            exit 1
          fi

          echo "[*] Confirmando creacion del Secret nativo en namespace default..."
          kubectl get secret agent-postgres-secret -n default -o jsonpath='{.data.DB_PASSWORD}' | base64 --decode >/dev/null
          echo "[OK] Secreto agent-postgres-secret validado con contrasenia cargada."