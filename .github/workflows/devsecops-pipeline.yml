name: DevSecOps pipeline

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  sast_and_sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff bandit pip-audit
      - name: Execute linter
        run: |
          ruff check . --select E9,F63,F7,F82 --statistics
      - name: Execute SAST
        run: |
          bandit -r . -ll -ii
      - name: Execute SCA
        run: |
          pip-audit -r requirements.txt

  build_scan_and_deploy_image:
    runs-on: ubuntu-latest
    needs:
      - sast_and_sca
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::104091534720:role/github-role-ecr
          aws-region: us-east-1
          audience: sts.amazonaws.com
      - name: ECR login
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build Docker Image
        run: |
          docker build -t 104091534720.dkr.ecr.us-east-1.amazonaws.com/simpledso-repo:latest .
      - name: Run trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '104091534720.dkr.ecr.us-east-1.amazonaws.com/simpledso-repo:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Push Image to ECR
        run: |
          docker push 104091534720.dkr.ecr.us-east-1.amazonaws.com/simpledso-repo:latest