name: simpledso-infra

on:
  workflow_dispatch:

concurrency:
  group: deploy-infra-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./envs/dev/
    env:
      TF_BUCKET: "${{ vars.TF_STATE_BUCKET }}"
      TF_REGION: "${{ vars.AWS_REGION }}"
      TF_DYNAMODB: "${{ vars.DYNAMODB_TABLE }}"
      TF_ROLE: "${{ secrets.AWS_ROLE_ARN }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: OIDC AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE }}
          aws-region: ${{ env.TF_REGION }}

      # Paso 1: Resolver módulos localmente en envs/dev/ sin conectar al backend
      - name: Terraform Local Init (Dependency Resolution)
        run: terraform init -backend=false

      # Paso 2: Escanear el directorio envs/dev ya inicializado
      - name: Run Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'envs/dev'
          skip-dirs: '.terraform'
          trivyignores: 'envs/dev/.trivyignore'
          hide-progress: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # Paso 3: Cargar el reporte a GitHub Advanced Security (CodeQL)
      - name: Upload Trivy IaC scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      # Paso 4: Inicialización real conectando a S3 + DynamoDB
      - name: Terraform Init Remote Backend
        run: |  
          terraform init -reconfigure \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="dynamodb_table=${TF_DYNAMODB}" \
            -backend-config="region=${TF_REGION}"
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_key_pair_name: ${{ secrets.EC2_KEY_PAIR_NAME }}
          TF_VAR_erp_target: "cloud"
        run: |
          terraform plan \
            -input=false \
            -var-file="terraform.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan