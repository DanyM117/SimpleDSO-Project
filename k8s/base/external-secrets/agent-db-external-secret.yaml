apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-db-credentials
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: agent-postgres-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_HOST: "{{ .host }}"
        DB_PORT: "{{ .port }}"
        DB_NAME: "{{ .dbname }}"
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
        ERP_API_KEY: '{{ .erp_api_key | default "" }}'
        ERP_API_SECRET: '{{ .erp_api_secret | default "" }}'
  dataFrom:
    - extract:
        key: "simpledso/dev/agent-db/credentials"